name: Release Extensions

# 触发方式：只打 tag 才构建与发布。
# 日常 push 代码不跑打包（ffmpeg 打包很耗时且耗 CI 额度），只做轻量校验。
# 采用「分扩展前缀 tag」，两个扩展可独立发版：
#   wechat-v*     → 只跑 wechat-publish job
#   doc-video-v*  → 只跑 doc-video job
on:
  push:
    tags:
      - "doc-video-v*"
      - "wechat-v*"
  # 手动兜底：需要临时出包时到 Actions 页面点按钮
  # 注意：手动触发时 GITHUB_REF_NAME 是分支名，版本一致性校验会自动跳过（见各 job 的校验步骤）
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

# 同一 tag 只允许一个构建在跑
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 锁定打包器版本，避免上游升级导致产物结构突变。
  # 说明：@anthropic-ai/dxt 已被官方废弃并改名为 @anthropic-ai/mcpb，
  #      新版命令为 `mcpb pack`，产物扩展名为 .mcpb。
  MCPB_CLI: "@anthropic-ai/mcpb@2.1.2"

jobs:
  # ---------------------------------------------------------------
  # 公众号发布套件（Python 工具型智能体 + 排版 skill 包）
  # 无需构建步骤：Python 项目由宿主 uv 解析依赖，打包是纯 zip
  # ---------------------------------------------------------------
  wechat-publish:
    name: 打包 公众号发布套件
    runs-on: ubuntu-latest
    # 仅 wechat-v* tag 触发本 job；手动触发时两个 job 都跑，便于临时出包
    if: startsWith(github.ref, 'refs/tags/wechat-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 版本一致性校验（tag 与 manifest 必须一致）
        # 手动触发时 GITHUB_REF_NAME 是分支名，无法比对，跳过校验
        if: github.event_name == 'push'
        working-directory: agents/wechat-publish/publisher
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#wechat-v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          PYPROJECT_VERSION="$(node -e "console.log(require('fs').readFileSync('pyproject.toml','utf8').match(/^version\s*=\s*\"([^\"]+)\"/m)[1])")"
          echo "tag=$TAG_VERSION  manifest=$MANIFEST_VERSION  pyproject=$PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag 版本($TAG_VERSION) 与 manifest.json 版本($MANIFEST_VERSION) 不一致"
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::manifest.json 版本($MANIFEST_VERSION) 与 pyproject.toml 版本($PYPROJECT_VERSION) 不一致"
            exit 1
          fi

      - name: 打包智能体
        run: |
          cd agents/wechat-publish/publisher
          npx -y ${MCPB_CLI} pack . wechat-sop-publish-assistant.mcpb

      - name: 校验产物内容
        run: |
          set -euo pipefail
          PKG="agents/wechat-publish/publisher/wechat-sop-publish-assistant.mcpb"
          echo "--- 产物清单 ---"
          unzip -l "$PKG"
          # 必需文件必须进包（icon 以 manifest.json 声明的为准）
          for f in manifest.json main.py pyproject.toml icon.png .python-version src/publisher.py src/wechat_compat.py; do
            unzip -l "$PKG" | grep -q " $f\$" || { echo "::error::产物缺少必需文件 $f"; exit 1; }
          done
          # 虚拟环境与缓存绝不能进包
          if unzip -l "$PKG" | grep -qE "\.venv/|__pycache__/|\.pyc\$|uv\.lock"; then
            echo "::error::产物夹带了虚拟环境或缓存文件"; exit 1
          fi
          echo "OK: 产物校验通过"

      - name: 打包排版 skill 包
        run: |
          cd agents/wechat-publish/skills
          zip -r -q wechat-article-sop-layout.zip wechat-article-sop-layout
          unzip -l wechat-article-sop-layout.zip | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: wechat-publish
          path: |
            agents/wechat-publish/publisher/wechat-sop-publish-assistant.mcpb
            agents/wechat-publish/skills/wechat-article-sop-layout.zip
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 文档一键成片（Node.js 工具型智能体；ffmpeg 由用户自行安装，不打进包）
  # ---------------------------------------------------------------
  doc-video:
    name: 打包 文档一键成片
    runs-on: ubuntu-latest
    # 仅 doc-video-v* tag 触发本 job；手动触发时两个 job 都跑，便于临时出包
    if: startsWith(github.ref, 'refs/tags/doc-video-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 版本一致性校验
        # 手动触发时 GITHUB_REF_NAME 是分支名，无法比对，跳过校验
        if: github.event_name == 'push'
        working-directory: agents/doc-video
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#doc-video-v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          echo "tag=$TAG_VERSION  manifest=$MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag 版本($TAG_VERSION) 与 manifest.json 版本($MANIFEST_VERSION) 不一致"
            exit 1
          fi

      - name: 安装依赖
        working-directory: agents/doc-video
        run: bun install --frozen-lockfile

      - name: 构建 server.js
        working-directory: agents/doc-video
        run: bun run build

      - name: 打包扩展
        run: |
          cd agents/doc-video
          npx -y ${MCPB_CLI} pack . doc-video.mcpb

      - name: 校验产物内容与体积
        run: |
          set -euo pipefail
          PKG="agents/doc-video/doc-video.mcpb"
          echo "--- 产物清单 ---"
          unzip -l "$PKG"
          # 必需运行时文件
          for f in manifest.json server.js icon.png; do
            unzip -l "$PKG" | grep -q " $f\$" || { echo "::error::产物缺少必需文件 $f"; exit 1; }
          done
          # 源码与依赖不能进包
          if unzip -l "$PKG" | grep -qE " server/| node_modules/| package\.json\$"; then
            echo "::error::产物夹带了源码或依赖"; exit 1
          fi
          # ffmpeg 不随包分发（用户自行安装）：夹带会让产物超过 Release 单文件上限
          if unzip -l "$PKG" | grep -qE " vendor/.*(ffmpeg|ffprobe)"; then
            echo "::error::产物夹带了 ffmpeg 二进制，会让包体积失控，请检查 .mcpbignore 的 /vendor/ 规则"; exit 1
          fi
          # 体积闸门：正常应在 2MB 上下，明显偏大说明打包规则失效
          SIZE=$(stat -c%s "$PKG")
          MB=$((SIZE / 1024 / 1024))
          echo "产物体积：${MB} MB"
          if [ "$SIZE" -ge 20000000 ]; then
            echo "::error::产物 ${MB}MB 异常偏大（预期 2MB 级），请检查 .mcpbignore 是否被改坏"
            exit 1
          fi
          echo "OK: 产物校验通过"

      - uses: actions/upload-artifact@v4
        with:
          name: doc-video
          path: agents/doc-video/doc-video.mcpb
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 汇总发布：把本次实际构建的产物挂到同一个 GitHub Release
  # 每次 tag 只会有一个扩展 job 真正执行，另一个被 skip，
  # 因此这里用 always() + 结果判断，保证「至少一个成功即可发布」。
  # ---------------------------------------------------------------
  publish:
    name: 发布 Release
    needs: [wechat-publish, doc-video]
    runs-on: ubuntu-latest
    # 至少一个前置 job 成功，且没有任何失败/取消，才发布
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.*.result, 'success')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 整理产物清单
        run: find dist -type f | sort

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # 按文件名匹配（download-artifact 会保留上传时的子目录层级，如 dist/wechat-publish/publisher/...）
          # 打 wechat-v* 只产生 wechat 两个文件，doc-video 路径不匹配属预期，不要开 fail_on_unmatched_files
          files: |
            dist/**/wechat-sop-publish-assistant.mcpb
            dist/**/wechat-article-sop-layout.zip
            dist/**/doc-video.mcpb
          body: |
            ## 安装方式

            到 AiPy 客户端「集市 → 本地安装」选择对应的扩展包：

            | 产物 | 类型 | 说明 |
            |------|------|------|
            | `wechat-sop-publish-assistant.mcpb` | 智能体 | 公众号发布助手（解析终稿、写草稿箱、文字与兼容性校验） |
            | `wechat-article-sop-layout.zip` | skill 包 | 公众号排版 SOP（排版规范、风格矩阵、预检脚本） |
            | `doc-video.mcpb` | 智能体 | 文档一键成片（横屏讲解 / 竖屏短视频） |

            > `doc-video.mcpb` 已不内置 ffmpeg（三平台全量约 126 MB，会超过 GitHub Release 单文件 100 MB 限制）。
            > 使用前请先安装：macOS 执行 `brew install ffmpeg`，Windows 执行 `winget install Gyan.FFmpeg`。
            > 插件会自动在 PATH 与常见安装路径中查找；如仍检测不到，可在插件设置中用环境变量 `FFMPEG_PATH` 指定绝对路径。
