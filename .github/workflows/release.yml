name: Release Extensions

# 触发方式：只打 tag 才构建与发布。
# 日常 push 代码不跑打包（mcpb pack 较耗时且耗 CI 额度），只做轻量校验（见 check.yml）。
# tag 用「扩展名前缀」命名，将来新增扩展时在此补一行前缀、对应的 job 用 startsWith 自行分流：
#   wechat-v*  → 跑 wechat-publish job
on:
  push:
    tags:
      - "wechat-v*"
  # 手动兜底：需要临时出包时到 Actions 页面点按钮
  # 注意：手动触发时 GITHUB_REF_NAME 是分支名，版本一致性校验会自动跳过（见各 job 的校验步骤）
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

# 同一 tag 只允许一个构建在跑
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 锁定打包器版本，避免上游升级导致产物结构突变。
  # 说明：@anthropic-ai/dxt 已被官方废弃并改名为 @anthropic-ai/mcpb，
  #      新版命令为 `mcpb pack`。
  # 产物后缀必须是 .dxt：AiPy Pro 2.1.0 的文件选择器只放行 zip/dxt/md，
  # 安装前还有 [".zip",".dxt"].includes(后缀) 的硬校验，.mcpb 会被客户端直接拒绝。
  # .dxt 与 .mcpb 同为 zip、只是文件名不同，因此保留新版打包器、只改输出名。
  MCPB_CLI: "@anthropic-ai/mcpb@2.1.2"

jobs:
  # ---------------------------------------------------------------
  # 公众号发布套件（Python 工具型智能体，排版知识库已合并进智能体的 resources/）
  # 自 2.0.0 起只发一个 .dxt：原独立排版 skill 已并入 resources/，不再单独出包
  # 无需构建步骤：Python 项目由宿主 uv 解析依赖，打包是纯 zip
  # ---------------------------------------------------------------
  wechat-publish:
    name: 打包 公众号发布套件
    runs-on: ubuntu-latest
    # 仅 wechat-v* tag 触发本 job；手动触发（workflow_dispatch）时也跑，便于临时出包
    if: startsWith(github.ref, 'refs/tags/wechat-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 版本一致性校验（tag 与 manifest 必须一致）
        # 手动触发时 GITHUB_REF_NAME 是分支名，无法比对，跳过校验
        if: github.event_name == 'push'
        working-directory: agents/wechat-publish
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#wechat-v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          PYPROJECT_VERSION="$(node -e "console.log(require('fs').readFileSync('pyproject.toml','utf8').match(/^version\s*=\s*\"([^\"]+)\"/m)[1])")"
          echo "tag=$TAG_VERSION  manifest=$MANIFEST_VERSION  pyproject=$PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag 版本($TAG_VERSION) 与 manifest.json 版本($MANIFEST_VERSION) 不一致"
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::manifest.json 版本($MANIFEST_VERSION) 与 pyproject.toml 版本($PYPROJECT_VERSION) 不一致"
            exit 1
          fi

      - name: 打包智能体
        run: |
          cd agents/wechat-publish
          npx -y ${MCPB_CLI} pack . wechat-sop-publish-assistant.dxt

      - name: 校验产物内容
        run: |
          set -euo pipefail
          PKG="agents/wechat-publish/wechat-sop-publish-assistant.dxt"
          # 清单只解一次并复用：既省掉重复解压，也避免 set -o pipefail 下
          # 「unzip -l | grep -q」因 grep 提前退出、反让 unzip 收到 SIGPIPE(141)
          # 而把管道状态判成非 0、误报「缺少必需文件」
          LIST=$(unzip -l "$PKG")
          echo "--- 产物清单 ---"
          printf '%s\n' "$LIST"
          # 必需文件必须进包（icon 以 manifest.json 声明的为准）
          for f in manifest.json main.py pyproject.toml icon.png .python-version src/publisher.py src/wechat_compat.py; do
            printf '%s\n' "$LIST" | grep -q " $f\$" || { echo "::error::产物缺少必需文件 $f"; exit 1; }
          done
          # 虚拟环境与缓存绝不能进包。
          # uv.lock 不在此列：它随包分发，是用户侧 `uv run` 复现依赖解析的前提（见 .mcpbignore 同名说明），
          # 拦它会与「让依赖可复现」的目标自相矛盾。
          if printf '%s\n' "$LIST" | grep -qE "\.venv/|__pycache__/|\.pyc\$"; then
            echo "::error::产物夹带了虚拟环境或缓存文件"; exit 1
          fi

          # ---- 排版知识库 resources/ ----
          # 2.0.0 起原独立排版 skill 已并入 resources/，它是本次合并的核心交付物：
          # 丢了 resources/ 智能体仍能启动，但模型没有排版规则与素材，等于废了。
          # SOP.md 是全流程规则入口，get_sop 工具直接读它，必须进包
          printf '%s\n' "$LIST" | grep -q " resources/SOP\.md\$" \
            || { echo "::error::产物缺少 resources/SOP.md（排版全流程规则入口，get_sop 依赖它）"; exit 1; }
          # references（排版规范，现 10 篇）与 assets（视觉素材，现 19 个）设「下限」而非等值：
          # 本项只防「知识库整体丢失 / 被 .mcpbignore 误放行」，以后新增规范或素材不必改这里
          N_REF=$(printf '%s\n' "$LIST" | grep -cE " resources/references/[^/]+\.md\$" || true)
          N_ASSET=$(printf '%s\n' "$LIST" | grep -cE " resources/assets/.+[^/]\$" || true)
          echo "包内知识库：references=$N_REF 篇，assets=$N_ASSET 个"
          if [ "$N_REF" -lt 10 ]; then
            echo "::error::resources/references 只打进 $N_REF 篇（应至少 10 篇），排版规范丢失，请检查 .mcpbignore"
            exit 1
          fi
          if [ "$N_ASSET" -lt 19 ]; then
            echo "::error::resources/assets 只打进 $N_ASSET 个（应至少 19 个），视觉素材丢失，请检查 .mcpbignore"
            exit 1
          fi
          # resources/ 之外不应再有 .md 知识文件（旧独立 skill 的排版规范等被误打进包）
          # 例外：包根 README.md 是智能体自带的说明文档，属常规随包内容
          STRAY_MD=$(printf '%s\n' "$LIST" | awk '{print $NF}' | grep -E '\.md$' | grep -v '^resources/' | grep -v '^README\.md$' || true)
          if [ -n "$STRAY_MD" ]; then
            echo "$STRAY_MD"
            echo "::error::产物里 resources/ 之外混入了 .md 知识文件，请检查 .mcpbignore 是否放行了已删除的 skill 目录"
            exit 1
          fi

          # 体积上限校验：当前约 197KB（实测 201893 字节 / 52 个文件，uv.lock 随包后上涨约 60%，
          # 不含 .mcpbignore 排除的 README.md），明显偏大说明打包规则失效
          SIZE=$(stat -c%s "$PKG")
          echo "产物体积：$((SIZE / 1024)) KB"
          if [ "$SIZE" -ge 2097152 ]; then
            echo "::error::产物 $((SIZE / 1024)) KB 异常偏大（上限 2MB，当前应 200KB 级），请检查 .mcpbignore 是否被改坏"
            exit 1
          fi
          echo "OK: 产物校验通过"

      - uses: actions/upload-artifact@v4
        with:
          name: wechat-publish
          path: |
            agents/wechat-publish/wechat-sop-publish-assistant.dxt
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 汇总发布：把本次实际构建的产物挂到同一个 GitHub Release
  # ---------------------------------------------------------------
  publish:
    name: 发布 Release
    needs: [wechat-publish]
    runs-on: ubuntu-latest
    # 原为 needs 同时依赖两个扩展 job + always() + 「至少一个 success」判断：
    # 因为两个扩展并行、只有匹配 tag 的那个真正执行、另一个被 skip，才需要 always() 去
    # 覆盖「前置被 skip」这一情形，再手工从 needs.*.result 里挑出成功的那一个。
    # 现在仓库只剩 wechat-publish 一个扩展，它就是 needs 里唯一的依赖：
    #   它 success → 有产物可发（唯一可发布路径）；skipped → 没产物；
    #   failure / cancelled → 中断，绝不该发。
    # 收敛成 success()：它在 needs 长度为 1 时与上面的组合条件逐项等价（见下方对照），
    # 且不依赖「needs 恒含 success」这种间接推理，既不会恒真放行，也不会因 job 被 skip 而误判。
    #   needs 结果   原组合条件           success()
    #   success      true(发布)           true(发布)
    #   skipped      false                false
    #   failure      false                false
    #   cancelled    false                false
    # 将来新增第二个扩展时，必须把这段改回 always() + 结果判断的写法。
    if: success()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 整理产物清单
        run: find dist -type f | sort

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # 按文件名匹配（download-artifact 会保留上传时的子目录层级，如 dist/wechat-publish/wechat-sop-publish-assistant.dxt）
          # 目前只有 wechat 一个产物，上面这个 glob 必须命中它才谈得上发布。
          # 不开 fail_on_unmatched_files（保持默认 false）：产物缺失已由上游 wechat-publish 的
          # upload-artifact `if-no-files-found: error` 拦死（打包没出文件会直接让 job 失败，
          # publish 的 success() 就不会成立），上游这道闸门更早、更准，这里不必再加一道
          # 会因 download-artifact 目录层级调整而误失败的闸门。
          files: |
            dist/**/wechat-sop-publish-assistant.dxt
          body: |
            ## 安装方式

            到 AiPy 客户端「集市 → 本地安装」选择扩展包（请勿改名或改后缀，AiPy 只认 `.zip` / `.dxt`）：

            | 产物 | 类型 | 说明 |
            |------|------|------|
            | `wechat-sop-publish-assistant.dxt` | 智能体 | 公众号文章从终稿到草稿箱全流程（含排版 SOP 知识库），装一个包即可 |
