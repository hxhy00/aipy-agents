<!-- 仅当原文已有 CTA/互动文字时使用。 -->
<section style="margin:32px 0 12px;padding:20px 18px;text-align:center;background:linear-gradient(135deg,#174A7E,#21699C);border-radius:14px;box-shadow:0 12px 28px rgba(23,74,126,.16);"><p style="margin:0;color:#FFFFFF;font-size:16px;font-weight:700;line-height:1.7;">{{SOURCE_CTA_OR_INTERACTION_TEXT}}</p></section>
<!-- 原文有二维码图片时使用；无法提取则把占位文字作为对应图片占位。 -->
<section style="margin:28px 0;padding:20px;text-align:center;background:#FFFFFF;border:1px solid #D9E5F1;border-radius:14px;"><img src="{{SOURCE_QR_IMAGE}}" alt="" style="display:block;width:180px;max-width:70%;height:auto;margin:0 auto 12px;"><p style="margin:0;color:#64748B;font-size:13px;line-height:1.65;">{{SOURCE_QR_CAPTION_OR_IMAGE_PLACEHOLDER}}</p></section>
