<!-- 活动/发布会视觉骨架：海报感标题、时间轴和原文 CTA。 -->
<section style="box-sizing:border-box;margin:0 auto;padding:22px 18px;background:#FFF7F1;color:#3B2B25;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;word-break:break-word;">
  <section style="margin:38px 0 20px;padding:22px 18px;background:linear-gradient(135deg,#D55B32,#F2A33B);border-radius:16px;box-shadow:0 13px 30px rgba(213,91,50,.18);"><span aria-hidden="true" style="display:block;width:42px;height:4px;margin-bottom:12px;background:rgba(255,255,255,.75);border-radius:99px;"></span><h2 style="margin:0;color:#FFFFFF;font-size:24px;font-weight:800;line-height:1.4;letter-spacing:.5px;">{{LEVEL_ONE_HEADING}}</h2></section>
  <section style="margin:14px 0 28px;padding-left:18px;border-left:2px solid #D55B32;"><section style="display:flex;align-items:center;margin:10px 0;"><span aria-hidden="true" style="width:12px;height:1px;margin-left:-18px;margin-right:10px;background:#F2A33B;"></span><span style="padding:6px 11px;background:#FFFFFF;border:1px solid #F1D9C9;border-radius:8px;color:#8A4932;font-size:14px;font-weight:650;line-height:1.6;">{{ORIGINAL_LEVEL_TWO_HEADING}}</span></section></section>
  <section style="margin:24px 0;padding:17px 16px;background:#FFFFFF;border:1px solid #F1D9C9;border-radius:14px;box-shadow:0 8px 22px rgba(213,91,50,.07);"><p style="margin:0;font-size:16px;line-height:1.85;">{{SOURCE_EVENT_INFO}}</p></section>
  <section style="margin:28px 0;padding-left:17px;border-left:2px solid #F2A33B;"><section style="position:relative;margin:0 0 18px;padding:0 0 0 14px;"><span aria-hidden="true" style="position:absolute;left:-22px;top:7px;width:9px;height:9px;background:#D55B32;border:3px solid #FFF7F1;border-radius:50%;"></span><p style="margin:0;font-size:16px;line-height:1.8;">{{SOURCE_AGENDA_ITEM}}</p></section></section>
  <section style="margin:30px 0 10px;padding:18px;text-align:center;background:#D55B32;border-radius:14px;"><p style="margin:0;color:#FFFFFF;font-size:16px;font-weight:700;line-height:1.7;">{{SOURCE_CTA_TEXT_ONLY}}</p></section>
</section>
