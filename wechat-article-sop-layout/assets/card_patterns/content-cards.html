<!-- 只把完整原文段落放入卡片。 -->
<section style="position:relative;margin:24px 0;padding:18px 17px;background:#FFFFFF;border:1px solid #D9E5F1;border-radius:12px;box-shadow:0 9px 24px rgba(23,74,126,.07);overflow:hidden;"><span aria-hidden="true" style="position:absolute;left:0;top:0;width:4px;height:100%;background:linear-gradient(180deg,#174A7E,#28B7C9);"></span><span aria-hidden="true" style="position:absolute;right:-17px;top:-17px;width:46px;height:46px;border:1px solid rgba(40,183,201,.18);transform:rotate(45deg);"></span><p style="margin:0;color:#152238;font-size:16px;line-height:1.85;letter-spacing:.2px;">{{SOURCE_PARAGRAPH}}</p></section>
<!-- 仅用于源文已有引用或问答。 -->
<section style="margin:26px 0;padding:18px 17px;background:linear-gradient(135deg,#F3F7FC,#FFFFFF);border-left:4px solid #174A7E;border-radius:0 13px 13px 0;"><span aria-hidden="true" style="display:block;width:34px;height:4px;margin-bottom:11px;background:#28B7C9;border-radius:99px;"></span><p style="margin:0;color:#253A50;font-size:17px;font-weight:600;line-height:1.8;">{{SOURCE_QUOTE_OR_ANSWER}}</p></section>
