interface:
  display_name: "公众号文章排版 SOP"
  short_description: "终稿（Word/Markdown）+ 可选模板路径 → 选风格 → 排版生成 HTML → 预检 → 发布到公众号草稿箱"
  default_prompt: "Use $wechat-article-sop-layout to take my Word/Markdown draft all the way to the WeChat Official Account draft box: parse the manuscript, pick a style, generate the WeChat HTML, pre-check it, then publish. 我会提供「终稿路径」和可选的「模板路径」（风格参考，可为 HTML/截图/Markdown/案例目录）；给了模板路径就跑 scripts/read_template.py 学习其设计语言并原创化融合，没给就按 references/style_matrix.md 选风格。按全流程 SOP 执行，确定性步骤用 scripts 下的脚本，排版由你完成。"
policy:
  allow_implicit_invocation: true
